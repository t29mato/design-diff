[project]
name = "design-diff"
version = "0.1.0"
description = "Class-level structure diff for Python PRs: Mermaid classDiagram + JSON, for humans and AI reviewers."
readme = "README.md"
authors = [
    { name = "t29mato", email = "tomoya.matou@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "py2puml>=0.11.0",
]

[project.scripts]
design-diff = "design_diff.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/design_diff"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

